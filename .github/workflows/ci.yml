name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,audio]"
      - run: pytest -q
      - run: python -m puente_voice.sim.text_sim scenarios
  fhir:
    runs-on: ubuntu-latest
    services:
      hapi:
        image: hapiproject/hapi:v8.12.0-2
        ports: ["8080:8080"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Wait for HAPI
        run: for i in $(seq 120); do curl -sf http://localhost:8080/fhir/metadata > /dev/null && exit 0; sleep 2; done; exit 1
      - run: pytest -m fhir -q tests/test_fhir_integration.py   # the other modules need the audio extra
        env:
          PUENTE_FHIR_URL: http://localhost:8080/fhir
        env:
          PUENTE_FHIR_URL: http://localhost:8080/fhir
