; DEMO ONLY. The caller softphone dials 100 and reaches the agent over AudioSocket. When the agent transfers the call,
; it rings the staff softphone; otherwise the call ends. No context can reach an outside line.
[general]
static=yes
writeprotect=yes

[puente-in]
exten => 100,1,Answer()
 same => n,Set(CALL=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,AudioSocket(${CALL},${ENV(PUENTE_AGENT)})
 same => n,Set(OUTCOME=${CURL(http://${ENV(PUENTE_AGENT_HTTP)}/outcome/${CALL})})
 same => n,Verbose(0,PUENTE_OUTCOME ${OUTCOME})
 same => n,GotoIf($["${OUTCOME}" = "transferred"]?staff)
 same => n,Hangup()
 same => n(staff),Dial(PJSIP/staff,30)
 same => n,Hangup()

[staff-in]
; the staff phone only receives calls
